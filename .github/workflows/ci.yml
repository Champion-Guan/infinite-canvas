name: Source quality gates
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # macos-15 now targets ARM64, whose hosted pool can expire before a job starts.
    # Source checks run on Intel; native ARM64 package QA remains a release check.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/canvas/package-lock.json
      - run: npm ci --ignore-scripts
      # Existing Pro Components beta declares antd 5 peers; preserve the tested
      # locked antd 6 graph explicitly until a separately tested provider upgrade.
      - run: npm ci --prefix src/canvas --ignore-scripts --legacy-peer-deps
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix src/canvas --legacy-peer-deps --audit-level=moderate
      - run: npm --prefix src/canvas run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:all-current
      - run: npm run build:canvas
      - run: npm run secrets:scan
      - run: npm run secrets:history
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: stable
      - name: Independent secret scan (redacted)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" git --log-opts=--all --redact --no-banner --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" > "$RUNNER_TEMP/gitleaks.log" 2>&1
          "$(go env GOPATH)/bin/gitleaks" dir src/canvas/dist --redact --no-banner --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/gitleaks-build.json" > "$RUNNER_TEMP/gitleaks-build.log" 2>&1
